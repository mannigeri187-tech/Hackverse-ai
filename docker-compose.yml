version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: hackverse-postgres
    restart: always
    environment:
      POSTGRES_USER: hackverse
      POSTGRES_PASSWORD: hackverse_secret_password_2026
      POSTGRES_DB: hackverse_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: hackverse-redis
    restart: always
    ports:
      - "6379:6379"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hackverse-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://hackverse:hackverse_secret_password_2026@postgres:5432/hackverse_db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=hackverse-secret-key-2026-production
      - NODE_ENV=production
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
